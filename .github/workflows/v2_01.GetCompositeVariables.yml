name: 01.GetCompositeVariables

on:
  workflow_call:
    outputs:
      assemblyVersion:
        description: 'assembly Version for the current build'
        value: ${{ jobs.main.outputs.assemblyVersion }}
      sourceTag:
        description: 'Release tag matching the assembly version'
        value: ${{ jobs.main.outputs.sourceTag }}

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  main:
    runs-on: self-hosted
    outputs:
      assemblyVersion: ${{ steps.get_assembly_version.outputs.assemblyVersion }}
      sourceTag: ${{ steps.get_assembly_version.outputs.sourceTag }}

    env:
      versionPrefix: '0.8.0'

    steps:
      - name: Get Assembly Version
        id: get_assembly_version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
          VERSION_PREFIX: ${{ vars.VERSION_PREFIX || env.versionPrefix }}
        run: |
          $offset = if ([string]::IsNullOrWhiteSpace($env:BUILD_NUMBER_OFFSET)) { 0 } else { [int] $env:BUILD_NUMBER_OFFSET }
          $build = [int] $env:BUILD_NUMBER + $offset
          $assemblyVersion = "$env:VERSION_PREFIX.$build"

          # Consumed by eng/Publish-Packages.ps1, which requires a lowercase 'v' prefix.
          $sourceTag = "v$assemblyVersion"

          Write-Host "VERSION_PREFIX      = $env:VERSION_PREFIX"
          Write-Host "BUILD_NUMBER        = $env:BUILD_NUMBER"
          Write-Host "BUILD_NUMBER_OFFSET = $offset"
          Write-Host "assemblyVersion     = $assemblyVersion"
          Write-Host "sourceTag           = $sourceTag"

          "assemblyVersion=$assemblyVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sourceTag=$sourceTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
