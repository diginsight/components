name: 04.PublishPackages

on:
  workflow_call:
    inputs:
      assemblyVersion:
        description: 'Version to publish'
        required: true
        type: string
      sourceTag:
        description: 'Release tag matching the assembly version'
        required: true
        type: string
      artifactName:
        description: 'Name of the immutable package artifact produced by 03.BuildPackages'
        required: true
        type: string
    secrets:
      NUGET_API_KEY_V3:
        required: true

permissions: {}

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  publish:
    name: Publish packages to nuget.org
    # Runs on a GitHub-hosted runner because it needs outbound access to https://api.nuget.org,
    # which is blocked on the corporate self-hosted runner. It only pushes pre-built packages,
    # so it never compiles the Windows-only (WPF) projects.
    runs-on: ubuntu-latest

    # Deliberately read-only: this job must not be able to create or modify a release.
    permissions:
      contents: read

    env:
      SOURCE_TAG: ${{ inputs.sourceTag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Download immutable package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: artifacts/publish

      - name: Revalidate package artifact
        run: ./eng/Publish-Packages.ps1 -Command Validate -Tag $env:SOURCE_TAG -StagePath ./artifacts/publish

      - name: Publish NuGet Packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY_V3 }}
        run: ./eng/Publish-Packages.ps1 -Command PublishNuGet -Tag $env:SOURCE_TAG -StagePath ./artifacts/publish

      - name: NuGet publication summary
        if: always()
        env:
          PACKAGE_VERSION: ${{ inputs.assemblyVersion }}
        run: |
          @(
            "### NuGet publication"
            "- Source tag: ``$env:SOURCE_TAG``"
            "- Package version: ``$env:PACKAGE_VERSION``"
            "- Result: ``${{ job.status }}``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
