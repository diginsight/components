name: Diginsight.Components CICD main

on:
  push:
    branches:
      - main
    paths:
      - 'src/Diginsight.Components*/**'
      - 'src/Directory.Build.props'
      - 'src/Directory.Build.targets'
      - 'src/NuGet.Config'
      - 'src/*.slnx'
      - 'eng/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/Diginsight.Components*/**'
      - 'src/Directory.Build.props'
      - 'src/Directory.Build.targets'
      - 'src/NuGet.Config'
      - 'src/*.slnx'
      - 'eng/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Build and validate without creating a release or publishing'
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  installActions:
    uses: ./.github/workflows/v2_00.InstallActions.yml
    permissions:
      contents: read
    secrets: inherit

  getCompositeVariables:
    needs: installActions
    uses: ./.github/workflows/v2_01.GetCompositeVariables.yml
    permissions: {}
    secrets: inherit

  # Builds on the self-hosted Windows runner (WPF / net*-windows require Windows) and publishes a
  # durable, remotely verified GitHub Release before anything reaches NuGet.org.
  buildPackages:
    needs: getCompositeVariables
    uses: ./.github/workflows/v2_03.BuildPackages.yml
    permissions:
      contents: write
    with:
      assemblyVersion: ${{ needs.getCompositeVariables.outputs.assemblyVersion }}
      sourceTag: ${{ needs.getCompositeVariables.outputs.sourceTag }}
      dryRun: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun }}
    secrets: inherit

  # Publishes on a GitHub-hosted Ubuntu runner, which can reach api.nuget.org.
  # Gated on remote verification of the release, and never runs from a pull request.
  publishPackages:
    if: ${{ github.event_name != 'pull_request' && needs.buildPackages.outputs.releaseVerified == 'true' }}
    needs:
      - getCompositeVariables
      - buildPackages
    uses: ./.github/workflows/v2_04.PublishPackages.yml
    permissions:
      contents: read
    with:
      assemblyVersion: ${{ needs.getCompositeVariables.outputs.assemblyVersion }}
      sourceTag: ${{ needs.getCompositeVariables.outputs.sourceTag }}
      artifactName: ${{ needs.buildPackages.outputs.artifactName }}
    secrets: inherit
